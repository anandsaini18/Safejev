[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "safejev"
version = "0.0.1"
description = "Real-time safety checks for LLM reasoning streams, powered by JEV."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mukul Saini" }]
keywords = ["llm", "ai-safety", "guardrails", "reasoning", "streaming", "anthropic", "openai", "jev"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/anandsaini18/Safejev"
Issues = "https://github.com/anandsaini18/Safejev/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/safejev"]

[tool.hatch.build.targets.sdist]
include = ["/src"]
